[workspace]
resolver = "2"
members = [
    "mbedtls-rs",
    "mbedtls-rs-sys",
]

exclude = ["examples", "xtask"]

[workspace.dependencies]
defmt = { version = "1", default-features = false }
log = { version = "0.4", default-features = false }
enumset = { version = "1", default-features = false }
time = { version = "0.3", default-features = false }
critical-section = { version = "1", default-features = false }

embedded-io = { version = "0.7", default-features = false }
embedded-io-async = { version = "0.7", default-features = false }
rand_core = { version = "0.10.1", default-features = false }

# For esp-hal hook impls
esp-hal = { version = "~1.1.0", default-features = false }
crypto-bigint = { version = "0.7", default-features = false }

# For embassy timer hook impl
embassy-time = {version = "0.5", default-features = false}

# For embassy-crypto hook impls
embassy-crypto = { version = "0.1", default-features = false }
# Software `embassy-crypto` drivers, for testing the embassy-crypto hook impls
# (unpublished; keep on the same revision as the `embassy-crypto` patch below)
embassy-crypto-rustcrypto = { git = "https://github.com/embassy-rs/embassy", rev = "463a07b963419a1bfe61d5d597c44acb810afb8b", default-features = false }

mbedtls-rs-sys = { version = "0.2", path = "mbedtls-rs-sys", default-features = false }

# Build dependencies
anyhow = "1"
bindgen = "0.72"
env_logger = "0.11"
cmake = "0.1.52"
cc = "1.1"
fs_extra = "1.3"
embuild = "0.33"

[patch.crates-io]
# crates.io only has a reserved 0.0.0 placeholder of `embassy-crypto`
embassy-crypto = { git = "https://github.com/embassy-rs/embassy", rev = "463a07b963419a1bfe61d5d597c44acb810afb8b" }
